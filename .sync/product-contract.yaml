  - id: "external_ai_provider_roster_and_composer_browser"
    purpose: "External AI provider choices (Gemini, ChatGPT, Claude, 기기 AI) in a single responsive row in Composer with user-selectable hidden/visible browser automation, deterministic status progression, and manual fallback in-app browser."
    source_refs:
      - file: "StarManager/Features/Composer/ComposerView.swift"
        description: "AI choice row and retained background web browser for AI generation"
    entry_points:
      - "ComposerScreen -> AIChoiceCard / GlossyPrimaryButton"
    preconditions:
      - "Non-empty user idea entered"
    inputs:
      - "User idea, selected provider (Gemini, ChatGPT, Claude, 기기 AI), compact prompt"
      - "Persisted browser visibility choice (default OFF)"
    normal_result: "With browser visibility OFF, an attached WebView runs invisibly; with it ON, the same provider automation is shown full-screen from connection onward. Both modes inject and submit the prompt, relay status/errors, and automatically import a stable cleaned result."
    states:
      IDLE: "Waiting for user action"
      CONNECTING: "Connecting to provider and preparing input area ('{provider}에 연결하는 중…' / '입력창을 준비하고 있어요')"
      SUBMITTED: "Prompt submitted to provider ('정보를 보냈어요')"
      WAITING_COUNTDOWN: "Reverse countdown from 1:59 to 0:00 with a shrinking progress bar while the provider answer is pending"
      COMPLETED: "Stable answer extracted, cleaned, and imported into preview; focus/keyboard dismissed"
      FALLBACK_INTERACTION: "In-app browser presented with reason banner for login, security/CAPTCHA, or manual input"
      ERROR: "Sanitized provider error relayed to Composer status card"
    algorithms_and_thresholds:
      - "DOM selector matching for ProseMirror, Lexical, Quill, textarea, and contenteditable"
      - "Streaming protection: 3 consecutive stable polls (initial + 2 identical readings at 700ms cadence) of non-empty cleaned text without active streaming indicators"
      - "Readiness timeout: 35s deadline, 700ms probe cadence, max 12 consecutive misses (~8.4s) triggering fallback"
      - "Submission escalation: 15s deadline, 500ms cadence, 700ms verification delay with 4-stage escalation (button click, pointer/mouse, form submit, Enter key events)"
      - "Visible autofill timeout: 45s deadline with late DOM replacement recovery"
      - "Generation deadline: 119 seconds from submission; reverse countdown formats M:SS from 1:59 to 0:00 and the linear progress bar shrinks from 1.0 to 0.0"
      - "At 0:00 the request is canceled automatically, the browser task is closed, and the host shows a short retry action"
      - "Error sanitization: strip HTML tags, script/style, URLs, tokens/secrets, stack traces; concise max 80 chars; provider errors abort directly to host state without opening browser"
      - "Origin security: exact scheme (https) and host allowlist check separating script origins from auth origins; script injection prohibited on auth origins"
      - "Fallback detection: OAuth/login redirects (AUTH_REQUIRED), Cloudflare/CAPTCHA challenges (SECURITY_VERIFICATION), 12 input misses (MANUAL_INPUT_REQUIRED), disallowed navigation (NAVIGATION_DISALLOWED)"
      - "Keyboard focus dismissal: clearFocus(force = true) and hide keyboard on non-empty import only"
      - "Composer scroll keyboard dismissal: on the first non-zero vertical NestedScrollSource.UserInput delta, clearFocus(force = true) and hide the software keyboard; tapping the story input can acquire focus again normally"
    data_contracts:
      AIChoice:
        External: "Gemini, ChatGPT, Claude"
        OnDevice: "기기 AI"
      ExternalAIAutomationPhase: "IDLE, CONNECTING, SUBMITTED, WAITING_COUNTDOWN, COMPLETED, FALLBACK_REQUIRED, ERROR"
      ExternalAIFallbackReason: "LOGIN_REQUIRED ('로그인이 필요해요'), SECURITY_VERIFICATION ('보안 확인이 필요해요'), MANUAL_INPUT_REQUIRED ('입력창을 찾지 못했어요'), MANUAL_CONFIRMATION ('화면 확인이 필요해요'), NAVIGATION_DISALLOWED ('다른 페이지로 이동했어요')"
      ExternalAITimingProfile: "readinessTimeoutMs=35000, readinessCadenceMs=700, maxReadinessMisses=12, submitTimeoutMs=15000, submitCadenceMs=500, submitVerificationDelayMs=700, visibleAutoFillTimeoutMs=45000, observationCadenceMs=700, stabilityRequiredTicks=2"
      showsExternalAIBrowser: "Boolean; false when no prior choice is stored"
    producer_consumer_routes:
      - "ComposerScreen executes HiddenExternalAIWebView -> ComposerViewModel.importAIResult -> PreviewColumn"
      - "When showsExternalAIBrowser=true: ComposerScreen executes ExternalAISurface from request start -> status/error callbacks -> automatic ComposerViewModel.importAIResult"
      - "Fallback trigger -> ExternalAISurface (with fallback reason banner) -> onImport -> ComposerViewModel.importAIResult"
    persistence_relaunch:
      - "Shared CookieManager and WebStorage retain login session tokens across launches"
      - "CreatorProfileStore persists browser visibility locally; absent value resolves to OFF"
    permissions_privacy_security:
      - "Strict HTTPS script vs auth origin separation, no credentials logged or exposed"
      - "Background WebView attached with density-aware 375x667 viewport at alpha=0.001f, non-interactive, and inaccessible to accessibility tree"
    background_lifecycle:
      - "Attached hidden WebView lifecycle cleanly destroyed and coroutines canceled on resetComposer or new request"
      - "Fresh automation state per request while cookie storage persists"
    gestures_accessibility:
      - "Provider buttons stay static and dimmed during generation; single rotating spinner in status card"
      - "Preview card remains still with empty placeholder until result arrives"
      - "Cancel button in both hidden-mode status card and visible browser header; cancellation clears the pending task and closes its WebView so every provider is immediately selectable again"
      - "User-driven scrolling anywhere in the Composer dismisses input focus and the software keyboard without consuming the scroll gesture"
    supported_devices_layouts:
      - "Single horizontal row for normal text scale, 2x2 grid for large text scale (>=1.3x)"
      - "Compact and regular two-column composer layouts"
    visual_reference:
      - "Static brand icon cards in order Gemini, ChatGPT, Claude, 기기 AI"
      - "Generation status card with single spinner, step title, 1:59 reverse countdown, shrinking linear progress bar, and cancel button"
    platform_adaptations:
      ios:
        status: "reference_verified"
        description: "Retained WKWebView background automation with 1:59 reverse countdown, shrinking progress bar, manual cancel, automatic deadline cancel, and interactive fallback"
      android:
        status: "runtime_verified"
        description: "Attached 375x667 alpha 0.001f hidden WebView plus optional full-screen visible automation, with 1:59 reverse countdown, shrinking progress bar, manual/automatic cancel, single composer spinner, error sanitization, automatic import, fallback reason banner, and focus dismissal"
    intentional_differences:
      local_ai_label: "Android uses '기기 AI' for local deterministic generator as Apple Intelligence is unavailable"
      hardened_origin_allowlist: "Android explicitly separates script origins from auth origins and forbids script injection on auth origins"
    implementations:
      ios:
        status: "reference_verified"
        entry_file: "StarManager/Features/Composer/ComposerView.swift"
        verification: "reference_verified"
      android:
        status: "runtime_verified"
