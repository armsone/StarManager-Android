capabilities:
  - id: "direct_updates"
    purpose: "In-app self-update management for direct APK distribution on Android, providing update checks, background downloading, cryptographic and package validation, and handoff to the system package installer."
    source_refs:
      - file: "StarManager/App/Distribution"
        description: "Apple platform update distribution (managed via TestFlight)"
    entry_points:
      - "ProfileSettingsScreen (DirectUpdateSettings under '앱 업데이트' section)"
      - "MainActivity.onCreate (DirectUpdateManager.start background check on startup)"
    preconditions:
      - "Active network connectivity"
      - "Official GitHub release assets published under armsone/StarManager-Android"
      - "Target APK signed with matching certificate and containing newer version or build code"
    inputs:
      - "Installed app version (BuildConfig.VERSION_NAME) and version code (BuildConfig.VERSION_CODE)"
      - "User automatic download preference (Boolean)"
      - "User UI actions (check, download, cancel, retry, install)"
    normal_result: "Verified APK file downloaded to external files directory and handed off to Android package installer via ACTION_VIEW with MIME application/vnd.android.package-archive and FLAG_GRANT_READ_URI_PERMISSION."
    states:
      IDLE: "Initial idle state before check or after completion"
      CHECKING: "Querying latest release metadata from official GitHub API"
      CURRENT: "Installed version matches or exceeds latest release"
      AVAILABLE: "Newer release found and ready for download"
      DOWNLOADING: "DownloadManager actively retrieving APK asset"
      READY: "APK verified (size, SHA-256, package name, version, signature) and ready for installer handoff"
      ERROR: "Error encountered during check, download, or verification"
    algorithms_and_thresholds:
      - "compareVersions: Semantic version comparison across dot-delimited segments"
      - "SHA-256 digest validation: Computed digest matched against release asset sha256"
      - "Package name match verification: archive.packageName == context.packageName"
      - "Version code check: archiveCode > BuildConfig.VERSION_CODE"
      - "Signer certificate validation: archive signer SHA-256 matched against app signatures"
      - "Auto-download conditions: Unmetered network connection AND (charging OR battery level >= 20%)"
      - "Release URL validation: HTTPS, host github.com, path /armsone/StarManager-Android/releases/download/{tag}/{asset}"
    data_contracts:
      DirectUpdateState:
        phase: "UpdatePhase (IDLE, CHECKING, CURRENT, AVAILABLE, DOWNLOADING, READY, ERROR)"
        automaticDownload: "Boolean"
        version: "String?"
        build: "Long?"
        notes: "String?"
        size: "Long?"
        downloaded: "Long"
        message: "String"
      ReleaseAsset:
        tag: "String"
        version: "String"
        build: "Long"
        notes: "String"
        name: "String"
        size: "Long"
        sha256: "String"
        url: "String"
    producer_consumer_routes:
      - "DirectUpdateManager produces StateFlow<DirectUpdateState>"
      - "DirectUpdateSettings composable in ProfileSettingsScreen consumes DirectUpdateState"
      - "Android DownloadManager broadcasts and cursor queries consumed by DirectUpdateManager.observeDownload"
    persistence_relaunch:
      - "SharedPreferences (direct_updates) persists automatic_download (Boolean) and download_id (Long)"
      - "Pending download ID restored and re-observed on app startup via DirectUpdateManager.start()"
    permissions_privacy_security:
      - "android.permission.INTERNET"
      - "android.permission.ACCESS_NETWORK_STATE"
      - "REQUEST_INSTALL_PACKAGES / Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES unknown app sources permission flow"
      - "Strict HTTPS endpoint, repo path validation, SHA-256 checksum verification, and signing certificate validation"
    background_lifecycle:
      - "System DownloadManager service handles download execution in background"
      - "Coroutine scope with SupervisorJob manages lifecycle-safe download observation and verification"
    gestures_accessibility:
      - "Switch toggle for automatic download with accessibility description"
      - "LinearProgressIndicator displaying download progress"
      - "Action buttons with clear semantic text ('다운로드', '취소', '설치', '다시 시도', '업데이트 확인')"
    supported_devices_layouts:
      - "Responsive layout embedded in ProfileSettingsScreen (content max width 760dp), supporting phone and tablet form factors"
    visual_reference:
      - "Settings section card with ArrowCircleDown icon well, switch row, progress bar, version/size info, and action buttons"
    platform_adaptations:
      ios:
        status: "intentional_exception"
        description: "TestFlight manages update discovery, download, and installation."
      android:
        status: "implemented_source_only"
        description: "GitHub Releases API integration, DownloadManager, SHA-256/signature verification, and system package installer handoff."
    intentional_differences:
      distribution_channel: "Apple version relies on TestFlight for distribution; Android version uses direct GitHub release APK downloads with in-app integrity verification."
    implementations:
      ios:
        status: "intentional_exception"
        notes: "Managed externally by Apple TestFlight."
      android:
        status: "implemented_source_only"
        entry_file: "app/src/main/java/com/armsone/starmanager/update/DirectUpdateManager.kt"
        verification: "pending_runtime"
    dependencies:
      - "android.app.DownloadManager"
      - "androidx.core.content.FileProvider"
      - "java.security.MessageDigest"
      - "org.json.JSONObject"
    parity_row_ids: []

  - id: "posting_handoff"
    purpose: "Dominant Instagram sharing workflow from the Composer preview surface, copying composed post text to the system clipboard and handing off single or multiple media attachments to the OS share sheet / chooser."
    source_refs:
      - file: "StarManager/Features/Composer/ComposerView.swift"
        symbol: "InstagramShareButton"
        description: "Dominant 'Instagram으로 →' button with automatic caption clipboard copy and UIActivityViewController handoff"
      - file: "StarManager/ViewModels/ComposerViewModel.swift"
        symbol: "prepareShare"
        description: "Prepares media attachments and handles clipboard copy before presenting share sheet"
    entry_points:
      - "ComposerScreen -> PreviewColumn -> GlossyPrimaryButton ('Instagram으로 →', testTag preview.share)"
    preconditions:
      - "Active post generated (state.generatedPost != null)"
      - "Draft signature is current with active profile and inputs (draftIsCurrent() == true)"
      - "Media attachment count is between 1 and 8 (MediaAttachmentPolicy.canShare)"
      - "Not currently generating or preparing share (!isGenerating && !isPreparingShare)"
    inputs:
      - "GeneratedPost (composedText, id)"
      - "ComposerUiState.mediaItems (1..8 items with byte data, MediaKind, and fileExtension)"
      - "Context (ContentResolver, cacheDir, ClipboardManager)"
    normal_result: "Composed caption text copied to system clipboard with label 'StarManager', temporary media files written to cache directory with zero-padded filenames, FileProvider content URIs generated with read permission grant, and Android chooser opened with ACTION_SEND or ACTION_SEND_MULTIPLE."
    states:
      idle: "Waiting for user to initiate share"
      isPreparingShare: "Writing share files to disk and generating FileProvider URIs (shows spinner and '준비 중')"
      valid_ready_to_share: "Post generated, media attached, draft current, share button enabled"
      stale_draft: "Inputs changed after generation, share blocked with warning message"
      missing_media: "0 media attached, share blocked with warning message ('사진이나 영상을 먼저 추가해 주세요.')"
      exceeded_media_limit: ">8 media items attached, share blocked ('미디어는 최대 8개까지 공유할 수 있어요.')"
    algorithms_and_thresholds:
      - "Media limits: min 1, max 8 items (MediaAttachmentPolicy.MAX_ITEMS = 8)"
      - "Draft currency check: generatedSignature == currentDraftSignature()"
      - "MIME type resolution: image/* for all images, video/* for all videos, */* for mixed attachments"
      - "Share directory cleanup: purge previous temporary files in cache before creating new share batch"
      - "File naming convention: zero-padded index String.format(Locale.ROOT, '%02d.%s', index + 1, ext)"
    data_contracts:
      ComposerMedia:
        id: "String"
        data: "ByteArray"
        kind: "MediaKind (IMAGE, VIDEO)"
        fileExtension: "String?"
        generatedFromPostId: "String?"
      GeneratedPost:
        id: "String"
        sourceIdea: "String"
        hook: "String"
        caption: "String"
        callToAction: "String"
        hashtags: "List<String>"
        composedText: "String"
        targetCharacterCount: "Int"
      DraftSignature:
        idea: "String"
        mood: "PostMood"
        length: "PostLength"
        profile: "CreatorProfile"
    producer_consumer_routes:
      - "ComposerViewModel.prepareShare consumes state.mediaItems and post -> generates Intent"
      - "ComposerScreen (PreviewColumn) launches Intent.createChooser(intent, null)"
    persistence_relaunch:
      - "Transient in-memory composer state"
      - "Share cache files deleted upon subsequent share preparation"
    permissions_privacy_security:
      - "FileProvider (com.armsone.starmanager.fileprovider) with FLAG_GRANT_READ_URI_PERMISSION"
      - "Temporary export files scoped to app-internal cache directory (context.cacheDir/share)"
      - "Original user media preserved in storage/gallery"
      - "Explicit clipboard write without leaking background data"
    background_lifecycle:
      - "File generation executed on Dispatchers.IO within CoroutineScope"
      - "resetVersion check guards against stale async completion if composer reset during preparation"
    gestures_accessibility:
      - "GlossyPrimaryButton with testTag preview.share, Send icon, and distinct loading state"
      - "Accessible status/error announcements for share validation messages (testTag preview.shareMessage)"
    supported_devices_layouts:
      - "Compact layout (single column, max width 680dp)"
      - "Regular layout (2 columns side-by-side, max width 1120dp for screen width >= 600dp)"
    visual_reference:
      - "Dominant glossy primary button ('Instagram으로 →', Send icon, 17sp bold text)"
      - "Caption copy notice ('문구는 자동 복사됩니다')"
      - "Media preview pager with page indicator badge ('1/N')"
    platform_adaptations:
      ios:
        status: "reference_verified"
        description: "Presents UIActivityViewController with media items and text directly in system share sheet."
      android:
        status: "build_verified_runtime_pending"
        description: "Copies text to Android ClipboardManager, creates ACTION_SEND or ACTION_SEND_MULTIPLE with FileProvider content URIs, ClipData, and FLAG_GRANT_READ_URI_PERMISSION, and presents system chooser."
    intentional_differences:
      clipboard_precopy: "Instagram for Android does not reliably accept pre-populated EXTRA_TEXT alongside media attachments; text is automatically copied to system clipboard prior to opening the system chooser."
      share_sheet: "iOS uses UIActivityViewController; Android uses Intent.createChooser with ACTION_SEND / ACTION_SEND_MULTIPLE."
      mime_generalization: "Android generalizes mixed media streams to */* MIME type."
    implementations:
      ios:
        status: "reference_verified"
        entry_file: "StarManager/Features/Composer/ComposerView.swift"
        verification: "reference_verified"
      android:
        status: "build_verified_runtime_pending"
        entry_file: "app/src/main/java/com/armsone/starmanager/ui/composer/ComposerScreen.kt"
        verification: "Unit tests, debug build, and lint passed; runtime behavior and visual parity remain pending."
    dependencies:
      - "androidx.core.content.FileProvider"
      - "android.content.ClipboardManager"
      - "android.content.Intent"
      - "com.armsone.starmanager.design.GlossyPrimaryButton"
    parity_row_ids:
      - "composer_posting_handoff_dominant_action"
      - "composer_posting_handoff_single_attachment"
      - "composer_posting_handoff_multiple_attachments"
      - "composer_posting_handoff_mime_types"
      - "composer_posting_handoff_guards"

  - id: "simplified_preferences_and_settings_order"
    purpose: "Personal, transparent writing preferences without owner-specific prose or preset shortcuts. Every instruction sent to AI is visible and editable in one settings surface."
    source_refs:
      - file: "StarManager/Features/Settings/ProfileSettingsView.swift"
        description: "iPhone Settings view top-to-bottom contract with simplified preferences"
    entry_points:
      - "ProfileSettingsScreen"
    preconditions:
      - "CreatorProfileStore initialized"
    inputs:
      - "User preferences (audience age, mood, destination, original-text reflection, emoji intensity, length, character count, detailed writing criteria, prohibited phrases, hashtags, external AI browser visibility, theme)"
    normal_result: "Settings persist neutral per-person writing preferences. Owner-authored defaults, the three '내 프리셋' cards, preset save/apply controls, and the separate tone field are absent."
    states:
      IDLE: "Viewing and editing settings"
    algorithms_and_thresholds:
      - "Destination maximums: Instagram 2200, KakaoTalk 200, X standard 280 characters"
      - "Emoji intensity: none, restrained, active, excessive"
      - "Original-text reflection is presented with plain-language choices instead of the ambiguous '이야기 비중' label"
    data_contracts:
      CreatorProfile:
        audienceAgeGroup: "AudienceAgeGroup"
        destination: "PostDestination"
        emojiIntensity: "EmojiIntensity"
        mood: "PostMood"
        preferredLength: "PostLength"
        controls: "GenerationControls"
        additionalInstructions: "String?; shown as 상세 작성 기준"
        prohibitedPhrases: "String"
        hashtagStyle: "String"
      showsExternalAIBrowser: "Boolean, defaults false and is stored separately from CreatorProfile JSON"
    producer_consumer_routes:
      - "ProfileSettingsScreen consumes and mutates CreatorProfileStore StateFlow"
    persistence_relaunch:
      - "SharedPreferences / JSON storage via CreatorProfileStore; exact legacy owner defaults migrate once to neutral values while user-authored values remain intact"
    permissions_privacy_security:
      - "Local device storage only"
    background_lifecycle:
