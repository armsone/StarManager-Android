  - id: "unified_media_first_composer"
    purpose: "One media-first composer supports photo-only, photo-and-text, or text-only drafting; AI assistance updates the same editable text field instead of opening a separate preview panel."
    source_refs:
      - file: "StarManager/Features/Composer/ComposerView.swift"
        description: "Current iPhone unified composer and optional representative-photo external AI handoff"
    entry_points:
      - "ComposerScreen"
    preconditions:
      - "At least one image or nonblank text is present before AI generation"
    inputs:
      - "Zero to eight media items"
      - "Optional editable draft text"
      - "Selected external provider or on-device AI"
    normal_result: "Media is selected or captured before or alongside writing; a generated answer replaces the same editable draft field and remains editable. External AI receives the first image when one exists; videos are never sent to AI."
    states:
      EMPTY: "No media and no text; generation disabled"
      MEDIA_ONLY: "Representative first image plus an explicit request to write from the image"
      MEDIA_AND_TEXT: "Representative first image plus the user's draft and visible writing preferences"
      TEXT_ONLY: "Draft text plus visible writing preferences"
      GENERATED_EDITABLE: "AI answer has returned to the same editable text field"
    algorithms_and_thresholds:
      - "Representative media is the first image in user-defined order; video entries are skipped"
      - "On-device generation remains text-only and clearly requires text"
      - "External provider attachment capability is positively confirmed; failure opens visible recovery instead of silently dropping the photo"
    data_contracts:
      representativeImage: "Optional bytes and MIME type derived from the first image item"
      composerText: "Single editable source of truth before and after generation"
    producer_consumer_routes:
      - "Photo picker or camera -> ComposerViewModel mediaItems -> composer media editor"
      - "Composer text/media -> external AI request -> same composer text field"
      - "Composer text -> on-device generator -> same composer text field"
    persistence_relaunch:
      - "Composer draft remains transient; profile preferences persist locally"
    permissions_privacy_security:
      - "Only the representative image is handed to the selected provider after the user invokes it"
      - "No video is handed to AI"
    background_lifecycle:
      - "Cancel or reset destroys the pending browser task without clearing unrelated local media"
    gestures_accessibility:
      - "Media actions precede the text editor and all generation actions have visible disabled/loading states"
    supported_devices_layouts:
      - "Compact phone and regular-width adaptive layouts"
    visual_reference:
      - "A single composer panel with media controls, editable story text, AI choices, and share action"
