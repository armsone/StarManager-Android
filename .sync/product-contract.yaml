  - id: "external_ai_login_session_reuse"
    purpose: "Truthful per-provider login state and dedicated in-app browser management for Gemini, ChatGPT, and Claude, with persistent web sessions shared between settings and composer."
    source_refs:
      - file: "StarManager/Features/Settings/ProfileSettingsView.swift"
        description: "External AI login rows opening provider web surfaces"
    entry_points:
      - "Settings -> 외부 AI 로그인 관리 -> provider row showing 확인 중, 로그인됨, or 로그인 필요"
    preconditions:
      - "Active network connection"
    inputs:
      - "Target provider (Gemini, ChatGPT, Claude)"
    normal_result: "Settings positively probes each provider session and shows a concise truthful state. A provider requiring login keeps the official in-app page open; positive authenticated DOM evidence changes the row to 로그인됨 and automatically closes the login surface exactly once."
    states:
      CHECKING: "확인 중 — loading the official provider page and waiting for positive DOM evidence"
      AUTHENTICATED: "로그인됨 — provider composer or another authenticated-only marker is present"
      LOGIN_REQUIRED: "로그인 필요 — login/auth page or visible login control is positively detected"
      UNCONFIRMED: "No positive authenticated or login-required evidence yet; continue checking without claiming either state"
    algorithms_and_thresholds:
      - "URL allowlist validation: strict HTTPS and verified provider domain suffixes and OAuth/SSO login hosts"
      - "Authentication requires positive provider DOM evidence; cookie presence or absence of a login control is insufficient"
      - "Ignore stale callbacks after provider/surface changes and deliver authenticated close at most once"
    data_contracts:
      DirectAIProvider:
        GEMINI: "https://gemini.google.com/app"
        OPEN_AI: "https://chatgpt.com/"
        CLAUDE: "https://claude.ai/new"
    producer_consumer_routes:
      - "Settings session probe -> per-provider concise state label"
      - "Provider row -> login surface -> authenticated callback -> settings state refresh and automatic dismissal"
    persistence_relaunch:
      - "Android CookieManager and WebStorage retain session tokens across launches"
    permissions_privacy_security:
      - "Zero credential capture or logging by the app; strict HTTPS host allowlist"
    background_lifecycle:
      - "WebView lifecycle stopped and destroyed on dispose"
    gestures_accessibility:
      - "Rows expose concise state and action semantics; close button and back handling remain available while login is required"
    supported_devices_layouts:
      - "Full screen responsive surface"
    visual_reference:
      - "Provider rows show 확인 중, 로그인됨, or 로그인 필요; full-screen surface shows provider title, close icon, truthful state, and native WebView"
    platform_adaptations:
      ios:
        status: "build_verified_runtime_pending"
        description: "Attached off-screen 375×667 WKWebView session probes and the login sheet implement the shared three-state wording, positive-evidence auto-dismiss, confirmed-state retention, and stale-callback cancellation contract; simulator build passed and authenticated-device verification remains pending"
      android:
        status: "runtime_verified"
        description: "Attached off-screen WebView session probes and the login surface implement the shared three-state wording and positive-evidence auto-dismiss contract; unit tests, debug build, replacement install, and authenticated SM-F968N runtime trace passed"
    intentional_differences:
      storage_engine: "Android uses default CookieManager and WebSettings DOM storage"
    implementations:
      ios:
        status: "build_verified_runtime_pending"
        entry_file: "StarManager/Features/Settings/ProfileSettingsView.swift"
        verification: "Source inspected and generic iOS Simulator debug build passed after attached-viewport and cancelled-probe race corrections; authenticated-device status timing and auto-dismiss trace pending"
      android:
        status: "runtime_verified"
        entry_file: "app/src/main/java/com/armsone/starmanager/ui/externalai/ExternalAISurface.kt"
        verification: "Focused ExternalAI unit tests, debug APK build, replacement install, all-provider 로그인됨 settings capture, and authenticated ChatGPT exactly-once auto-dismiss trace passed on SM-F968N"
    dependencies:
      - "android.webkit.WebView"
      - "android.webkit.CookieManager"
    parity_row_ids:
      - "settings_external_ai_login_management"
      - "settings_external_ai_login_status_labels"
